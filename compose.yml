name: meridian
services:
  tools:
    build: .
    image: meridian-tools:local
    working_dir: /app
    volumes:
      - .:/app
      - ivy:/root/.ivy2
    environment:
      PYTHONPATH: /app/src
      SPARK_LOCAL_IP: 127.0.0.1
    mem_limit: 2300m
    profiles: [tools]
  api:
    image: meridian-tools:local
    command: [python, -m, uvicorn, meridian.api:app, --host, 0.0.0.0, --port, '8010']
    volumes: [".:/app"]
    environment:
      PYTHONPATH: /app/src
    ports: ["127.0.0.1:${MERIDIAN_PORT:-8010}:8010"]
    # Demo job controls only enqueue allow-listed jobs; the port is bound to loopback.
    mem_limit: 400m
  worker:
    image: meridian-tools:local
    command: [python, -m, meridian.cli, worker]
    working_dir: /app
    volumes:
      - .:/app
      - ivy:/root/.ivy2
    environment:
      PYTHONPATH: /app/src
      SPARK_LOCAL_IP: 127.0.0.1
    depends_on: [kafka]
    mem_limit: 2300m
    profiles: [replay]
  kafka:
    image: apache/kafka:4.1.2@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e
    ports: ["127.0.0.1:${MERIDIAN_KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-data:/var/lib/kafka/data"]
    mem_limit: 600m
    profiles: [replay]
volumes:
  ivy:
  kafka-data:
